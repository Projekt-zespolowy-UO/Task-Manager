<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/userPage.css" />
    <title>Task manager</title>
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="nav-left">
          <a href=""
            ><img class="navbar-logo-shape" src="../images/logo.png" alt="logo"
          /></a>
          <img
            src="../images/profile-img.png"
            alt="profile picture"
            class="profile-picture"
          />
          <h1>Jan Kowalski</h1>
        </div>
        <div class="nav-center">
          <div class="search-input-div">
            <p class="search-icon">🔍</p>
            <input
              class="search-input"
              type="filtr"
              class="search-bar"
              placeholder="Szukaj zadań..."
            />
            <button class="clear-search">x</button>
          </div>
        </div>
        <div class="nav-right">
          <a class="signup-btn" href="registration.html">Wyloguj się</a>
          <div class="menu-toggle" id="menu-toggle">☰</div>
        </div>
      </div>
    </header>
    <div class="mobile-menu" id="mobile-menu">
      <a class="navbar-link" href="">Funkcje</a>
      <a class="navbar-link" href="">Kontakt</a>
      <a class="navbar-link" href="">Pomoc</a>
      <a class="navbar-link" href="">Informacje</a>
    </div>
    <div class="task-container">
      <button class="add-panel-btn">Dodaj panel</button>
    </div>
    <!-- Modal do dodawania panelu -->
   <div id="panel-modal" class="modal">
  <div class="modal-content">
    <h3>Nazwij nowy panel</h3>
    <input type="text" id="panel-name-input" placeholder="Wpisz nazwę..." />
    <div class="modal-actions">
      <button id="cancel-btn">Anuluj</button>
      <button id="save-btn">Dodaj</button>
    </div>
  </div>
</div>
<!-- modal do dodawania zadania --> 
<div id="task-modal" class="modal">
  <div class="modal-content">
    <h3>Dodaj nowe zadanie</h3>
    <input type="text" id="task-name-input" placeholder="Wpisz nazwę..." />
    <textarea
      id="task-description-input"
      placeholder="Wpisz opis zadania..."
      rows="5"
    ></textarea>
    <div class="modal-actions">
      <button id="task-cancel-btn">Anuluj</button>
      <button id="task-save-btn">Dodaj</button>
    </div>
  </div>
</div>
<!-- modal do szczegółów zadania -->
<div id="task-details-modal" class="modal">
  <div class="modal-content">
    <h3 id="task-details-title">Szczegóły zadania</h3>
    <div id="task-details-description" class="task-details-description"></div>
    <div class="modal-actions">
      <button id="task-details-close-btn">Zamknij</button>
    </div>
  </div>
</div>
    </div>
    <div class="overlay" id="overlay"></div>
    <script src="../scripts/pages/navigation.js"></script>
    <script src="../scripts/userPage/addPanel.js"></script>
  </body>
</html>
